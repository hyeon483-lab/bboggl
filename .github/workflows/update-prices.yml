name: Update stock prices

on:
  schedule:
    # 21:30 UTC = 미국 동부시간 오후 4:30(서머타임) / 오후 5:30(표준시) — 정규장 마감(오후 4시 ET) 이후
    - cron: '30 21 * * 1-5'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update-prices:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Fetch latest prices
        env:
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
        run: node scripts/update-prices.mjs

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- src/data/prices.json; then
            echo "No price changes, skipping commit."
            exit 0
          fi
          git add src/data/prices.json
          git commit -m "chore: daily price update ($(date -u +%Y-%m-%d))"
          git push
